<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>範例 5 — 新粗獷 / Neo-Brutalism</title>
<style>
  :root {
    --bg: #ffe94a;
    --ink: #0d0d0d;
    --card: #ffffff;
    --blue: #2f6bff;
    --pink: #ff5da2;
    --lime: #9dff3d;
    --cyan: #4ee3f5;
    --sh: 6px 6px 0 var(--ink);
    --sh-sm: 4px 4px 0 var(--ink);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Archivo', 'Arial Black', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    line-height: 1.55;
    background-image: linear-gradient(var(--ink) 1px, transparent 1px), linear-gradient(90deg, var(--ink) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: -1px -1px;
  }
  body::before { content: ''; position: fixed; inset: 0; background: rgba(255,233,74,.86); pointer-events: none; }
  .wrap { position: relative; max-width: 1080px; margin: 0 auto; padding: 34px 20px 80px; }

  .hero { background: var(--card); border: 4px solid var(--ink); box-shadow: var(--sh); padding: 26px; }
  .tagline { display: inline-block; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 800; letter-spacing: .16em; padding: 6px 12px; text-transform: uppercase; }
  h1 { font-size: clamp(38px, 9vw, 82px); line-height: 1.16; font-weight: 900; letter-spacing: -0.035em; margin: 16px 0 14px; text-transform: uppercase; }
  h1 mark { display: inline-block; background: var(--pink); color: var(--card); padding: 2px 12px; margin-top: 8px; }
  .hero p { font-weight: 600; max-width: 52ch; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 22px 0; }
  .stat { border: 4px solid var(--ink); box-shadow: var(--sh); padding: 18px; }
  .stat:nth-child(1) { background: var(--cyan); }
  .stat:nth-child(2) { background: var(--lime); }
  .stat:nth-child(3) { background: var(--pink); color: var(--card); }
  .stat span { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .stat b { display: block; font-size: 52px; line-height: 1; font-weight: 900; letter-spacing: -0.04em; margin-top: 6px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 18px; }
  .tabs button {
    font: inherit; font-weight: 800; cursor: pointer;
    background: var(--card); color: var(--ink);
    border: 3px solid var(--ink); box-shadow: var(--sh-sm);
    padding: 9px 16px; font-size: 15px;
    transition: transform .08s, box-shadow .08s, background .08s;
  }
  .tabs button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--blue); color: #fff; transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  .panel { background: var(--card); border: 4px solid var(--ink); box-shadow: var(--sh); }
  .panel-head { background: var(--ink); color: var(--bg); padding: 12px 18px; font-weight: 900; letter-spacing: .06em; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .panel-head small { color: var(--cyan); font-weight: 700; letter-spacing: .1em; }
  .list { padding: 6px 18px 18px; }
  .item { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 3px solid var(--ink); }
  .item:last-child { border-bottom: none; }
  .item .n { font-weight: 900; font-size: 13px; width: 30px; }
  .item .nm { font-weight: 700; font-size: 17px; flex: 1; }
  .chip { font-size: 12px; font-weight: 900; border: 3px solid var(--ink); padding: 3px 9px; letter-spacing: .06em; }
  .chip.required { background: var(--cyan); }
  .chip.general { background: var(--lime); }
  .cr { font-weight: 900; font-size: 15px; min-width: 74px; text-align: right; }
  .totals { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 18px 18px; }
  .totals span { border: 3px solid var(--ink); padding: 6px 12px; font-weight: 800; font-size: 13px; background: #f2f2f2; }
  .totals span:last-child { background: var(--pink); color: #fff; }

  h2 { font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin: 34px 0 14px; }
  h2::after { content: ''; display: block; width: 84px; height: 8px; background: var(--ink); margin-top: 6px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .cards li { list-style: none; background: var(--card); border: 4px solid var(--ink); box-shadow: var(--sh-sm); padding: 16px; font-weight: 600; }
  .cards li b { display: block; font-size: 30px; font-weight: 900; color: var(--blue); margin-bottom: 4px; }
  .docs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .docs a {
    display: block; background: var(--card); border: 4px solid var(--ink); box-shadow: var(--sh-sm);
    padding: 15px; font-weight: 800; color: var(--ink); text-decoration: none;
    transition: transform .08s, box-shadow .08s, background .08s;
  }
  .docs a:hover { background: var(--blue); color: #fff; transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
  .docs a::after { content: ' ↗'; }

  footer { margin-top: 34px; display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
  footer a { color: var(--ink); }

  @media (max-width: 780px) { .stats, .cards, .docs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="tagline">MGDA · 114 · 日間部</span>
    <h1>必修課程<br><mark>59 學分</mark></h1>
    <p>大一到大四全部專業核心科目，加上學校規劃的通識 30 學分。不能抵免、不能替代，只能修完。</p>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="panel">
    <div class="panel-head"><span id="ptitle">一上</span><small id="pmeta"></small></div>
    <div class="list" id="rows"></div>
    <div class="totals" id="totals"></div>
  </div>

  <h2>重要規定</h2>
  <ul class="cards" id="notes"></ul>

  <h2>官方文件</h2>
  <div class="docs" id="docs"></div>

  <footer><span>Style 05 — Neo-Brutalism</span><a href="index.html">← 回到範例列表</a></footer>
</div>

<script src="data.js"></script>
<script>
  const REQ = SEMESTERS.reduce((s, x) => s + sumBy(x.courses, 'required'), 0);
  const GEN = SEMESTERS.reduce((s, x) => s + sumBy(x.courses, 'general'), 0);
  stats.innerHTML = [['專業必修', REQ], ['必修通識', GEN], ['合計必修', REQ + GEN]]
    .map(([l, v]) => `<div class="stat"><span>${l}</span><b>${v}</b></div>`).join('');

  tabs.innerHTML = SEMESTERS.map((s, i) =>
    `<button role="tab" aria-selected="${i === 0}" data-i="${i}">${s.label}</button>`).join('');

  function render(i) {
    const s = SEMESTERS[i];
    ptitle.textContent = `${s.year} ${s.label}`;
    pmeta.textContent = `${s.courses.length} 門課`;
    rows.innerHTML = s.courses.map((c, n) => `
      <div class="item">
        <span class="n">${String(n + 1).padStart(2, '0')}</span>
        <span class="nm">${c.name}</span>
        <span class="chip ${c.type}">${c.type === 'required' ? '專業必修' : '通識'}</span>
        <span class="cr">${c.credits} / ${c.hours}</span>
      </div>`).join('');
    totals.innerHTML = `
      <span>專業必修 ${sumBy(s.courses, 'required')} 學分</span>
      <span>通識 ${sumBy(s.courses, 'general')} 學分</span>
      <span>本學期 ${sumBy(s.courses)} 學分</span>`;
    tabs.querySelectorAll('button').forEach((b, bi) => b.setAttribute('aria-selected', bi === i));
  }
  tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) render(+b.dataset.i); });
  render(0);

  notes.innerHTML = NOTES.map((n, i) => `<li><b>${String(i + 1).padStart(2, '0')}</b>${n}</li>`).join('');
  docs.innerHTML = DOCS.map(d => `<a href="${d.url}" target="_blank" rel="noopener">${d.label}</a>`).join('');
</script>
</body>
</html>
