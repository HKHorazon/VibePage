<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>114畢業門檻總整理 — 多遊系</title>
  <link rel="stylesheet" href="../framework/tailwind.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" v-cloak>
    <doc-layout
      current-file=""
      data-path="./Data/articles.json"
      index-path="./index.html"
      file-prefix="./"
    >
      <section style="padding: 2.5rem 0 2rem;">
        <span class="home-eyebrow">THRESHOLD.114 / 多遊系</span>
        <h1 class="home-title">
          <span class="brand-dark">114</span>
          <span class="brand-rainbow"><span class="brand-rainbow-sep">//</span> 畢業門檻總整理</span>
        </h1>

        <div class="stat-row" style="margin: 1.5rem 0 0.5rem;">
          <div class="stat">
            <span class="stat-label">分類</span>
            <span class="stat-value">{{ groups.length }}</span>
          </div>
          <div class="stat">
            <span class="stat-label">篇章</span>
            <span class="stat-value">{{ totalCount }}</span>
          </div>
          <div class="stat">
            <span class="stat-label">最後更新</span>
            <span class="stat-value stat-value--mono">{{ lastUpdate || '—' }}</span>
          </div>
        </div>

        <div class="grad-checklist">
          <div v-for="g in groups" :key="g.name" class="cl-group">
            <div class="cl-group-label">{{ g.name }}</div>
            <a
              v-for="a in g.articles"
              :key="a.file"
              :href="'./' + a.file"
              class="cl-item"
              :style="{ '--cl-color': g.color }"
            >
              <div class="cl-accent"></div>
              <div class="cl-body">
                <span class="cl-num">{{ a.num }}</span>
                <span class="cl-name">{{ a.title }}</span>
                <span class="cl-arrow">→</span>
              </div>
            </a>
          </div>
        </div>
      </section>
    </doc-layout>
  </div>

  <script type="module">
    import { createApp, ref, computed, onMounted } from '../framework/vue.esm-browser.js'
    import { DocLayout } from './doc-layout.js'

    const PALETTE = ['var(--cyan)', 'var(--magenta)', 'var(--blue)', 'var(--amber)', 'var(--green)']

    createApp({
      components: { DocLayout },
      setup() {
        const categories = ref([])

        onMounted(async () => {
          try {
            const res = await fetch('./Data/articles.json')
            if (!res.ok) throw new Error()
            const data = await res.json()
            categories.value = Array.isArray(data) ? [] : (data.categories || [])
          } catch {
            categories.value = []
          }
        })

        // 跨分類連續編號，與側欄的 index 分開（側欄用 CAT.NN）
        const groups = computed(() => {
          let n = 0
          return categories.value.map((c, i) => ({
            name: c.name || '未分類',
            color: PALETTE[i % PALETTE.length],
            articles: (c.articles || []).map((a) => ({
              ...a,
              num: String(++n).padStart(2, '0'),
            })),
          }))
        })

        const totalCount = computed(() =>
          groups.value.reduce((sum, g) => sum + g.articles.length, 0)
        )

        const lastUpdate = computed(() =>
          groups.value
            .flatMap((g) => g.articles)
            .reduce((max, a) => (a.date && a.date > max ? a.date : max), '')
        )

        return { groups, totalCount, lastUpdate }
      },
    }).mount('#app')
  </script>
</body>
</html>
