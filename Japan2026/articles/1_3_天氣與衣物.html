        <h1>天氣&衣物</h1>

        <hr>

        <ul>
          <li><strong>超熱</strong>：短袖為主，飯店會有洗衣設備，但要抓時間烘乾晾乾。</li>
          <li><strong>偶而午後雷陣雨</strong>：準備摺疊傘放行李箱。</li>
          <li>注意<strong>防曬</strong>。</li>
          <li>可準備<strong>薄外套</strong>。</li>
          <li>日本走路距離很長，請準備好走的<strong>鞋子</strong>。</li>
          <li><strong>抗熱配備</strong>：外出用毛巾、鴨舌帽、防曬乳（依個人需求準備）。</li>
