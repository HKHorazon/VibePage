        <h1>網路</h1>
        <span class="article-date">2026-07-20</span>

        <hr>

        <p>上網<strong>各自辦理</strong>，依需求自行選擇下列其中一種方式：</p>

        <ul>
          <li><strong>eSIM</strong>：免換實體卡、免歸還，但手機須支援 eSIM 機型。</li>
          <li><strong>實體上網卡</strong>：價格較便宜，缺點是換卡後原號碼無法接聽電話／簡訊。</li>
          <li><strong>WiFi 分享器</strong>：可多人共用、原號碼照常使用，但需額外攜帶、充電，並自行租借歸還。</li>
          <li><strong>電信漫遊</strong>：最方便免設定，但費用通常較高。</li>
        </ul>
