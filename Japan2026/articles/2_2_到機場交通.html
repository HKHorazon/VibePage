        <h1>到機場交通</h1>
        <span class="article-date">2026-07-20</span>

        <hr>

        <h2>主要方式：統聯客運</h2>
        <ul>
          <li>大家搭乘<strong>統聯客運</strong>前往機場，<strong>各自購買車票</strong>，不統一訂票。</li>
          <li>也可<strong>自行安排交通方式</strong>前往機場（如家人接送、其他客運、開車等），不強制搭乘統聯。</li>
        </ul>

        <div class="callout-warning">
          <div class="callout-warning-title">集合時間</div>
          <ul>
            <li>不論搭乘何種方式，<strong>全員須於 XX:XX 前抵達機場</strong>（時間待確認後補上）。</li>
          </ul>
        </div>

        <hr>

        <h2>待補事項</h2>
        <p>統聯班次時刻、上車地點與確切集合時間，將於確定後補充。</p>
