      <article class="article-body">
        <h1>規範</h1>

        <hr>

        <ol>
          <li>上課時間為 <strong>10:00～13:00</strong>，可喝水但無法吃東西。</li>
          <li>會在飯店<strong>提前集合帶隊</strong>，務必準時，並且<strong>吃完早餐</strong>。</li>
          <li>晚上回到旅館後<strong>要報備</strong>；隔天如果要上課請早點睡。</li>
          <li>請遵守<strong>日本法律與規範</strong>，注意某些店家不能拍照，看到「<strong>写真禁止</strong>」或「<strong>写真をご遠慮ください</strong>」就是禁止攝影，務必注意。</li>
        </ol>

        <div class="callout-warning">
          <div class="callout-warning-title">代表學校，務必守規</div>
          <ul>
            <li>大家是代表<strong>弘光科大多遊系</strong>，除日本法律規範外，上課也務必<strong>遵照課堂秩序</strong>。否則學校可以<strong>追回補助（約 8,500 元）</strong>。</li>
          </ul>
        </div>

        <div class="callout-warning">
          <div class="callout-warning-title">臨時狀況</div>
          <ul>
            <li>有任何狀況<strong>馬上用 LINE 聯絡</strong>，包含各種身體病痛、或無法準時回到旅館等等。</li>
          </ul>
        </div>
      </article>
