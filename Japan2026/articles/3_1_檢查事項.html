<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>檢查事項 — 多遊系日本amps短期研習 // 2026</title>
  <link rel="stylesheet" href="../../framework/tailwind.min.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ── 櫻花・動漫風 checklist ── */
    .checklist { list-style: none; padding-left: 0; }
    .checklist li { margin: 0.4rem 0; }

    .checklist label {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      cursor: pointer;
      padding: 0.5rem 0.85rem;
      border-radius: 14px;
      border: 1px dashed transparent;
      transition: all 0.2s ease;
      position: relative;
    }
    .checklist label:hover {
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--magenta) 22%, transparent),
        color-mix(in srgb, var(--cyan) 12%, transparent));
      border-color: color-mix(in srgb, var(--magenta) 55%, transparent);
      transform: translateX(3px);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--magenta) 25%, transparent);
    }
    .checklist label:hover::before {
      content: "✿";
      position: absolute;
      left: -0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--magenta-bright);
      font-size: 0.9rem;
      animation: sakura-spin 1.6s linear infinite;
    }
    @keyframes sakura-spin {
      from { transform: translateY(-50%) rotate(0deg); }
      to   { transform: translateY(-50%) rotate(360deg); }
    }

    .checklist input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 1.35rem;
      height: 1.35rem;
      min-width: 1.35rem;
      margin-top: 0.15rem;
      border: 2px solid var(--magenta);
      border-radius: 8px;
      background: #fff8fb;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 1px 3px rgba(255, 143, 171, 0.25);
    }
    .checklist input[type="checkbox"]:hover {
      transform: scale(1.12) rotate(-4deg);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--magenta) 25%, transparent);
    }
    .checklist input[type="checkbox"]:checked {
      background: linear-gradient(135deg, var(--magenta), var(--cyan-deep));
      border-color: var(--cyan-deep);
      transform: scale(1.08) rotate(6deg);
      box-shadow:
        0 0 0 3px color-mix(in srgb, var(--magenta) 30%, transparent),
        0 4px 12px color-mix(in srgb, var(--cyan-deep) 40%, transparent);
    }
    .checklist input[type="checkbox"]:checked::after {
      content: "✿";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.95rem;
      line-height: 1;
      font-weight: bold;
      animation: sakura-pop 0.35s ease-out;
    }
    @keyframes sakura-pop {
      0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
      70%  { transform: scale(1.4) rotate(20deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .checklist input[type="checkbox"]:checked + span {
      text-decoration: line-through;
      text-decoration-color: var(--magenta-bright);
      text-decoration-thickness: 2px;
      opacity: 0.5;
      transition: all 0.2s;
    }

    .checklist-reset {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin: 0.5rem 0 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 0.45rem 1.1rem;
      background: linear-gradient(135deg, #fff8fb, #ffe0ec);
      border: 1.5px solid var(--magenta);
      border-radius: 999px;
      color: var(--cyan-deep);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--magenta) 20%, transparent);
    }
    .checklist-reset::before { content: "✿"; font-size: 0.9rem; }
    .checklist-reset:hover {
      background: linear-gradient(135deg, var(--magenta), var(--cyan));
      color: #fff;
      transform: translateY(-2px) rotate(-2deg);
      box-shadow: 0 6px 18px color-mix(in srgb, var(--magenta) 45%, transparent);
    }
  </style>
</head>
<body>
  <div id="app">
    <doc-layout
      current-file="articles/3_1_檢查事項.html"
      data-path="../Data/articles.json"
      index-path="../index.html"
      file-prefix="../"
    >
      <article class="article-body">
        <h1>檢查事項</h1>

        <hr>

        <p>出發前一天照這張清單掃一遍，別到機場才發現東西沒帶。勾選狀態會存在瀏覽器裡。</p>

        <p>每一項後面的<strong>「見○○頁」</strong>就是該項目的詳細說明所在，不確定內容時先去翻那一頁。</p>

        <button type="button" class="checklist-reset" onclick="resetChecklist()">清除全部勾選</button>

        <h3>⓪ 旅途事項（已詳閱理解）</h3>
        <ul class="checklist">
          <li><label><input type="checkbox"><span>已詳閱並理解「規範」（見「規範」頁）</span></label></li>
          <li><label><input type="checkbox"><span>已詳閱並理解「實際行程」（見「實際行程」頁）</span></label></li>
          <li><label><input type="checkbox"><span>已詳閱並理解上課外行程為半自助（見「上課外行程說明」頁）</span></label></li>
          <li><label><input type="checkbox"><span>了解來回兩趟下飛機後會將登機證 &amp; 機票交給老師（見「機票繳交」頁）</span></label></li>
        </ul>

        <h3>① 證件（少一樣就上不了飛機）</h3>
        <ul class="checklist">
          <li><label><input type="checkbox"><span>中華民國護照（<strong>效期 6 個月以上</strong>，見「簽證&amp;Visit Japan Web」頁）</span></label></li>
          <li><label><input type="checkbox"><span><strong>役男短期出境核准通知單</strong>（限役男，紙本，見「男生兵役」頁）</span></label></li>
          <li><label><input type="checkbox"><span>Visit Japan Web 兩個 QR Code 已截圖存離線（見「簽證&amp;Visit Japan Web」頁）</span></label></li>
          <li><label><input type="checkbox"><span>身分證、健保卡（非出國用，留身邊備緊急聯絡用）</span></label></li>
        </ul>

        <h3>② 錢＆卡</h3>
        <ul class="checklist">
          <li><label><input type="checkbox"><span>日幣現金（分兩袋放，別全塞同一處，見「日幣」頁）</span></label></li>
          <li><label><input type="checkbox"><span>西瓜卡 Suica／Welcome Suica（見「西瓜卡」頁）</span></label></li>
          <li><label><input type="checkbox"><span>少量新台幣（回國搭車用，見「台灣機場交通」頁）</span></label></li>
        </ul>

        <h3>③ 3C＆電力</h3>
        <ul class="checklist">
          <li><label><input type="checkbox"><span>手機＋充電線＋充電頭（日本 100V 兩孔扁插，免轉接，見「網路」頁）</span></label></li>
          <li><label><input type="checkbox"><span><strong>行動電源</strong>（視需求攜帶，隨身行李不可託運，160 Wh 以下，見「行李」頁）</span></label></li>
          <li><label><input type="checkbox"><span>eSIM 已安裝或 SIM 卡／WiFi 分享器（見「網路」頁）</span></label></li>
          <li><label><input type="checkbox"><span>手持電扇（視需求攜帶，隨身行李不可託運，見「行李」頁）</span></label></li>
        </ul>

        <h3>④ 衣物＆盥洗</h3>
        <ul class="checklist">
          <li><label><input type="checkbox"><span>足量衣服、內衣褲、襪子（見「天氣&amp;衣物」頁）</span></label></li>
          <li><label><input type="checkbox"><span>摺疊傘（見「天氣&amp;衣物」頁）</span></label></li>
          <li><label><input type="checkbox"><span>好走的鞋子（見「天氣&amp;衣物」頁）</span></label></li>
          <li><label><input type="checkbox"><span>個人需求盥洗配備</span></label></li>
          <li><label><input type="checkbox"><span>抗熱配備：外出用毛巾、鴨舌帽、防曬乳（依個人需求準備，見「天氣&amp;衣物」頁）</span></label></li>
        </ul>

        <h3>⑤ 醫藥＆隨身小物</h3>
        <ul class="checklist">
          <li><label><input type="checkbox"><span>個人慣用藥（感冒、腸胃、頭痛、暈車、OK 繃，見「醫藥」頁）</span></label></li>
          <li><label><input type="checkbox"><span>痠痛貼布（依個人需求準備，見「醫藥」頁）</span></label></li>
          <li><label><input type="checkbox"><span>護照、藥品、現金放隨身不離身（見「隨身行李」頁）</span></label></li>
        </ul>

        <div class="callout-warning">
          <div class="callout-warning-title">出發當天最後檢查</div>
          <ul>
            <li>護照＋<strong>役男核准通知單</strong>是否在手邊？</li>
            <li><strong>Visit Japan Web 的 QR Code 截圖</strong>是否已存在相簿？</li>
            <li>其他東西都還有辦法用錢解決……</li>
            <li>行動電源／手持電扇＋鋰電池類是否已從託運行李移到隨身？</li>
          </ul>
        </div>
      </article>
    </doc-layout>
  </div>

  <script type="module">
    import { mountDocLayout } from '../doc-layout.js'
    mountDocLayout('#app')
  </script>

  <script>
    const CHECKLIST_KEY = 'japan2026-checklist-v1'
    const loadState = () => {
      try { return JSON.parse(localStorage.getItem(CHECKLIST_KEY) || '{}') } catch { return {} }
    }
    const saveState = (state) => localStorage.setItem(CHECKLIST_KEY, JSON.stringify(state))

    const initChecklist = () => {
      const state = loadState()
      document.querySelectorAll('.checklist input[type="checkbox"]').forEach((cb) => {
        const key = cb.nextElementSibling.textContent.trim()
        if (state[key]) cb.checked = true
        cb.addEventListener('change', () => {
          const s = loadState()
          if (cb.checked) s[key] = 1; else delete s[key]
          saveState(s)
        })
      })
    }

    window.resetChecklist = () => {
      if (!confirm('確定要清除所有勾選嗎？')) return
      localStorage.removeItem(CHECKLIST_KEY)
      document.querySelectorAll('.checklist input[type="checkbox"]').forEach((cb) => { cb.checked = false })
    }

    // Vue 掛載完 slot 內容才確定就位，用短延遲＋重試更保險
    const tryInit = (retries = 5) => {
      if (document.querySelector('.checklist input[type="checkbox"]')) {
        initChecklist()
      } else if (retries > 0) {
        setTimeout(() => tryInit(retries - 1), 50)
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => tryInit())
    } else {
      tryInit()
    }
  </script>
</body>
</html>
