        <h1>西瓜卡</h1>

        <hr>

        <p>西瓜卡（Suica）是日本的電子票證，搭車、超商付款都能用。</p>

        <ul>
          <li><strong>iPhone</strong>：下載「<a href="https://apps.apple.com/us/app/welcome-suica-mobile/id6738336566" target="_blank" rel="noopener">Welcome Suica Mobile</a>」App 開卡，免押金、免排隊。</li>
          <li><strong>Android</strong>：多數台灣機型不支援，建議到現場買<strong>實體卡</strong>（需押金，離境可退）。</li>
