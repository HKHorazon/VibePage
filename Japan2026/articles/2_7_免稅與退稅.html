        <h1>免稅與退稅</h1>

        <hr>

        <ul>
          <li>結帳時憑護照直接扣除消費稅。</li>
          <li>單店消費需<strong>達到特定金額</strong>才能享免稅（通常為 5,000 日圓以上）。</li>
          <li>結帳後店家通常會用<strong>專用袋子封裝</strong>商品。</li>
          <li><strong>消耗品類</strong>（食品、藥妝等）在出境前<strong>不可拆封</strong>，否則會被追稅。</li>
        </ul>
