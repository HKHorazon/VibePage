        <h1>日幣</h1>

        <hr>

        <ul>
          <li><strong>大概要帶多少？</strong>一日花費約台幣 1,000 元內（三餐、交通），兩趟機場交通約 1,000 元，所以至少約<strong>日幣 35,000 元</strong>；但你可能還有其他開銷（秋葉原公仔、零食、伴手禮），請自行計算。</li>
          <li>建議先在台灣<strong>換好日幣</strong>，匯率通常較日本當地划算。</li>
          <li>超商、多數店家可刷卡／電子支付（含 <strong>PayPay</strong>），但小吃攤、神社香油錢仍需現金。</li>
          <li>現金不夠可用當地 ATM（如 7-11）以提款卡提領日幣。</li>
          <li>當地也可用<strong>台幣現金兌換日幣</strong>，但匯率通常很糟，建議還是先在台灣換好。</li>
        </ul>
